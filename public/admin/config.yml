# لوحة التحكم (Sveltia CMS) — تكتب مباشرة إلى GitHub، بلا قاعدة بيانات ولا خادم.
# ترتيب الحقول: ما يُستعمل يومياً أولاً، ثم «🔎 جوجل» ثم «⚙️ إعدادات» في آخر النموذج.
# أسماء الحقول (name) مطابقة لـ src/content.config.ts — لا تغيّرها وإلا يفشل البناء.

backend:
  name: github
  repo: stayerkw/stayerkw.github.io
  branch: main
  base_url: https://stayerkw-cms-oauth.nqshatcarpet.workers.dev  # خادم OAuth (Cloudflare Worker، admin-oauth-worker/)
  auth_endpoint: auth

app_title: "لوحة عالم ستائر الكويت"
logo_url: /favicon.svg
site_url: https://alamcurtainskw.com
display_url: https://alamcurtainskw.com
output:
  omit_empty_optional_fields: true   # لا تُكتب الحقول الاختيارية الفارغة (opacity: '' كان يُفشل البناء)
editor:
  preview: false                   # نموذج كامل العرض (أوضح على الجوال)

# المكتبة العامة (Sveltia يشترط مساراً مطلقاً هنا). صور الأقسام نفسها تُحفظ بجانب ملفاتها
# (media_folder: "images" + public_folder: "./images" داخل كل قسم) لأن Astro يحسّن الصور النسبية فقط.
media_folder: "public/uploads"
public_folder: "/uploads"

# الصور تُضغط في المتصفح قبل الرفع: WebP بجودة 85 وأقصى بُعد 2000 بكسل (صور الجوال 5–12 م.ب تصير بضع مئات ك.ب).
# مكتبة الصور الجاهزة (Unsplash/Pexels…) مُعطّلة: الموقع لا يعرض إلا صوراً حقيقية من أعمالنا (قاعدة 5.1/5.2).
media_libraries:
  default:
    config:
      transformations:
        raster_image: {format: webp, quality: 85, width: 2000, height: 2000}
  stock_assets:
    providers: []

collections:
  # ───────────── الاستخدام اليومي ─────────────
  - name: "products"
    label: "المنتجات"
    label_singular: "منتج"
    icon: "shopping_bag"
    description: "منتجات المعرض. كل منتج يظهر في صفحته وفي صفحة نوعه."
    folder: "src/content/products"
    create: true
    slug: "{{fields.urlSlug}}"
    preview_path: "/products/{{slug}}/"
    identifier_field: title
    summary: "{{title}} · {{price}} د.ك/م²"
    thumbnail: image
    sortable_fields: ["title", "order", "price"]
    view_filters:
      - {label: "المنشور", field: draft, pattern: false}
      - {label: "المسودات", field: draft, pattern: true}
    view_groups:
      - {label: "النوع", field: curtainType}
    media_folder: "images"
    public_folder: "./images"
    fields:
      - {label: "اسم المنتج", name: "title", widget: "string", hint: "مثال: ستائر رول رمادي — مكتب"}
      - {label: "الصورة الرئيسية", name: "image", widget: "image", required: false, choose_url: false, hint: "صورة طولية 3:4 تظهر كاملة بلا قص."}
      - {label: "وصف الصورة", name: "imageAlt", widget: "string", required: false, hint: "النوع واللون والمكان، مثل: ستارة رول رمادية في مكتب."}
      - label: "نوع الستارة"
        name: "curtainType"
        widget: "relation"
        collection: "curtain-types"
        search_fields: ["title"]
        value_field: "{{slug}}"
        display_fields: ["title"]
        required: false
      - {label: "السعر (د.ك / م²)", name: "price", widget: "number", required: false, value_type: "float", min: 0, step: 0.5}
      - {label: "ملاحظة السعر", name: "priceNote", widget: "string", required: false}
      - {label: "صور إضافية", name: "gallery", widget: "list", required: false, field: {label: "صورة", name: "img", widget: "image", choose_url: false, required: false}}
      - {label: "الوصف التفصيلي", name: "body", widget: "markdown", required: false}
      - {label: "نوع القماش", name: "fabricType", widget: "string", required: false, hint: "فقط إن كنت متأكداً."}
      - {label: "الشفافية", name: "opacity", widget: "select", required: false, options: ["شفاف", "نصف معتم", "بلاك اوت"]}
      - {label: "الألوان المتاحة", name: "colors", widget: "list", required: false, field: {label: "لون", name: "color", widget: "string", required: false}}
      - {label: "العناية والتنظيف", name: "care", widget: "text", required: false}
      - {label: "🔎 وصف جوجل", name: "description", widget: "text", hint: "110–160 حرفاً يظهر تحت العنوان في نتائج البحث.", required: false}
      - label: "🔎 الكلمة المستهدفة"
        name: "focusKeyword"
        widget: "select"
        required: false
        hint: "كلمة واحدة من خريطة الكلمات، لصفحة واحدة فقط. يُنبّه الفحص إن غابت عن العنوان أو الوصف أو تكررت في صفحتين، ولا يمنع النشر."
        options: &keywords
