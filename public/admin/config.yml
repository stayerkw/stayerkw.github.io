    slug: "{{fields.urlSlug}}"
    preview_path: "/blog/{{slug}}/"
    identifier_field: title
    summary: "{{title}} · {{pubDate | date('YYYY-MM-DD')}}"
    sortable_fields: ["title", "pubDate", "order"]
    view_filters:
