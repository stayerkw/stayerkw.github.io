      - {label: "🔎 الكلمة المستهدفة", name: "focusKeyword", widget: "select", required: false, options: *keywords}
      - {label: "⚙️ رابط الصفحة (إنجليزي)", name: "urlSlug", widget: "string", pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "أحرف إنجليزية صغيرة وأرقام وشرطات فقط"], hint: "مثل jahra-wave-living. لا تغيّره بعد النشر."}
      - {label: "⚙️ الترتيب", name: "order", widget: "number", default: 1, value_type: "int", required: false}
      - {label: "⚙️ مسودة (مخفي عن الموقع)", name: "draft", widget: "boolean", default: false, required: false}

