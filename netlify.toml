# Netlify يُستخدم فقط لاستقبال مراجعات العملاء (netlify/functions/review.mts).
# الموقع نفسه يُنشر على GitHub Pages، لذلك لا يُبنى Astro هنا.
[build]
  publish = "netlify-public"
  command = "echo reviews-api"
  # لا تُعِد البناء إلا إذا تغيّرت دالة المراجعات
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify/ netlify.toml"
