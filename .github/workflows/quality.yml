name: فحص الجودة (طلبات الدمج)

# يعمل على كل طلب دمج (ومنها طلبات لوحة Decap في editorial_workflow) قبل أن يصل المحتوى إلى main.
# الصارم: يفشل عند أي تحذير (طول عنوان/وصف، تكرار) كي يُصلَح المحتوى قبل النشر.
on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: seo-lint (تنبيهات فقط)
        run: node scripts/seo-lint.mjs --report-only   # ينبّه ولا يُفشل (قرار المالك 2 أكتوبر)
      - name: فحص الروابط
        run: node scripts/check-links.mjs --report-only

  lighthouse:
    # استشاري: لا يمنع الدمج (continue-on-error) حتى تُضبط العتبات على بيانات النشر الفعلية.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse CI
        id: lh
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
      - name: ملخص Lighthouse (تنبيهات)
        if: always()
        run: node scripts/lh-summary.mjs "${{ steps.lh.outputs.resultsPath }}"
