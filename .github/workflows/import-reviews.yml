name: استيراد مراجعات العملاء

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-reviews
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/import-reviews.mjs
      - name: حفظ المراجعات الجديدة (بانتظار الموافقة)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "alamcurtains-reviews"
            git config user.email "reviews@users.noreply.github.com"
            git add src/content/reviews src/data/reviews-imported.json
            git commit -m "مراجعات عملاء جديدة بانتظار الموافقة"
            git push
          fi
