name: نشر الموقع على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow_urls: ${{ steps.indexnow.outputs.urls }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # لازم لـ lastmod الحقيقي في sitemap (تاريخ آخر commit لكل ملف)
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: ذاكرة الصور المحسّنة (لا يُعاد توليد AVIF/WebP للصور القديمة)
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-assets-${{ github.sha }}
          restore-keys: astro-assets-
      - name: Build
        run: npm run build
      - name: فحص السيو (تنبيهات فقط)
        run: node scripts/seo-lint.mjs --report-only   # ينبّه ولا يمنع النشر (قرار المالك 2 أكتوبر)
      - name: فحص الروابط الداخلية
        run: node scripts/check-links.mjs --report-only
      - name: وزن الصور المنشورة (تنبيهات فقط)
        run: node scripts/image-weight-check.mjs --report-only
      - name: ذاكرة IndexNow (بصمات صفحات آخر نشر)
        uses: actions/cache@v6
        with:
          path: .indexnow
          key: indexnow-${{ github.sha }}
          restore-keys: indexnow-
      - name: IndexNow — تجهيز الروابط المتغيرة
        id: indexnow
        run: |
          node scripts/indexnow.mjs prepare
          { echo "urls<<EOF"; cat .indexnow/urls.txt; echo; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # N-56: بعد اكتمال النشر يُرسل إلى Bing/IndexNow ما تغيّر فقط (لا يمنع النشر إن فشل)
  indexnow:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: إرسال IndexNow
        env:
          URLS: ${{ needs.build.outputs.indexnow_urls }}
        run: |
          mkdir -p .indexnow
          printf '%s\n' "$URLS" > .indexnow/urls.txt
          node scripts/indexnow.mjs submit
