name: نشر الموقع على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # لازم لـ lastmod الحقيقي في sitemap (تاريخ آخر commit لكل ملف)
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: فحص السيو (تنبيهات فقط)
        run: node scripts/seo-lint.mjs --report-only   # ينبّه ولا يمنع النشر (قرار المالك 2 أكتوبر)
      - name: فحص الروابط الداخلية
        run: node scripts/check-links.mjs --report-only
      - name: وزن الصور المنشورة (تنبيهات فقط)
        run: node scripts/image-weight-check.mjs --report-only
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
